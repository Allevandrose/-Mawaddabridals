<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Mawaddabridals">
  <title>Mawaddabridals</title>

  <!-- Badge background -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#1B2A4A"/>

  <!-- Cloud arc above the monogram -->
  <path d="M 26 34
           C 30 26 40 24 50 26
           C 60 24 70 26 74 34"
        stroke="#C9A96E"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        opacity="0.85"/>

  <!-- Monogram "M" in gold -->
  <path d="M 30 74
           L 30 44
           L 50 62
           L 70 44
           L 70 74"
        stroke="#C9A96E"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Diamond accent above the M -->
  <path d="M 50 36 L 53.5 39.5 L 50 43 L 46.5 39.5 Z"
        fill="#E8D5B0"/>
</svg>